<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Financial Hub</title>
  <script>
    // Apply the saved theme before anything is drawn (no flash of the wrong colors)
    try { var t = localStorage.getItem('financialHub.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%234f7d5e'/><path d='M9 22V14M16 22V9M23 22V17' stroke='white' stroke-width='3' stroke-linecap='round'/></svg>">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f6f2ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#191816" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap">
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9"/><path d="M9 22V14M16 22V9M23 22V17"/></svg>
        <span>Financial Hub</span>
      </div>
      <nav id="tabs" class="tabs" aria-label="Sections" hidden>
        <button data-click="tab" data-tab="overview">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7V19a1.5 1.5 0 0 1-1.5 1.5h-4v-6h-6v6H5A1.5 1.5 0 0 1 3.5 19z"/></svg>
          <span>Home</span></button>
        <button data-click="tab" data-tab="month">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17v3zM14.5 7.5l2 2"/></svg>
          <span>Log</span></button>
        <button data-click="tab" data-tab="networth">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 17 9 11.5l4 4 7.5-7.5M15 8h5.5v5.5"/></svg>
          <span>Net worth</span></button>
        <button data-click="tab" data-tab="budgets">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5V12h8.5M20.5 12A8.5 8.5 0 1 1 12 3.5"/></svg>
          <span>Budgets</span></button>
        <button data-click="tab" data-tab="goals">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="0.8"/></svg>
          <span>Goals</span></button>
        <button data-click="tab" data-tab="recurring">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3.5l3 3-3 3M4 11V9.5a3 3 0 0 1 3-3h13M7 20.5l-3-3 3-3M20 13v1.5a3 3 0 0 1-3 3H4"/></svg>
          <span>Fixed</span></button>
        <button data-click="tab" data-tab="data">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg>
          <span>Settings</span></button>
      </nav>
      <div id="status" class="status"></div>
    </div>
  </header>

  <main id="view"></main>

  <dialog id="modal"></dialog>
  <input type="file" id="import-file" accept=".json,application/json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- Plain scripts in a fixed order, no build step -->
  <script src="js/config.js?v=4"></script>
  <script src="js/storage.js?v=4"></script>
  <script src="js/calc.js?v=4"></script>
  <script src="js/charts.js?v=4"></script>
  <script src="js/example.js?v=4"></script>
  <script src="js/app.js?v=4"></script>
</body>
</html>
